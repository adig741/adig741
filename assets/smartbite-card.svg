<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">SmartBite prototype architecture</title>
  <desc id="desc">The HX711 weight sensor and button connect to Arduino, which controls a WS2812B LED strip and HC-06 Bluetooth module.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142032"/><stop offset="1" stop-color="#21334B"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#78DFE0"/><stop offset="1" stop-color="#B8A8F9"/></linearGradient>
  </defs>
  <rect width="900" height="230" rx="20" fill="url(#bg)"/>
  <text x="36" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F5F9FF">SmartBite</text>
  <text x="36" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#A9BED6">ARDUINO PROTOTYPE</text>
  <path d="M209 135h86m191 0h80m0 0v-40h47m-47 40v40h47" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="250" cy="135" r="4" fill="#8AE3E5"/><circle cx="539" cy="135" r="4" fill="#BDA9F8"/>
  <rect x="32" y="96" width="177" height="78" rx="13" fill="#203952" stroke="#6BD1D8"/>
  <text x="53" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" fill="#F5F9FF">HX711 + button</text>
  <text x="53" y="153" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ABC7D8">Input and weight</text>
  <rect x="295" y="96" width="191" height="78" rx="13" fill="#26445D" stroke="#86DFE1"/>
  <text x="327" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#F5F9FF">Arduino</text>
  <text x="327" y="153" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#B6D2E3">Read · respond · control</text>
  <rect x="613" y="57" width="253" height="72" rx="13" fill="#32415D" stroke="#C6A9F1"/>
  <text x="634" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" fill="#F5F9FF">15 WS2812B LEDs</text>
  <text x="634" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#D2C3E4">Color and rainbow patterns</text>
  <rect x="613" y="144" width="253" height="72" rx="13" fill="#32415D" stroke="#C6A9F1"/>
  <text x="634" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" fill="#F5F9FF">HC-06 Bluetooth</text>
  <text x="634" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#D2C3E4">Simple text commands</text>
</svg>
